<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="250">
  <defs>
    <!-- Rich Whimsical Cosmic Background Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0919" />
      <stop offset="35%" stop-color="#190e2e" />
      <stop offset="70%" stop-color="#140b29" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <!-- Holographic Pastel Magic Gradient for Title -->
    <linearGradient id="holoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7eb3" />
      <stop offset="30%" stop-color="#ff758c" />
      <stop offset="55%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Pill Badge Gradients -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Star Symbol Def -->
    <g id="sparkleStar">
      <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" />
    </g>
    <g id="miniStar">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" />
    </g>
  </defs>

  <style>
    .name-title {
      font-family: 'Comfortaa', 'Quicksand', 'Outfit', 'Nunito', 'Century Gothic', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: 3px;
      fill: url(#holoGradient);
    }
    .subtitle {
      font-family: 'Quicksand', 'Nunito', 'Poppins', -apple-system, sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 2.5px;
      fill: #fbcfe8;
      opacity: 0.95;
    }
    .pill-text {
      font-family: 'Fira Code', 'Comfortaa', monospace, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Card -->
  <rect width="920" height="250" rx="20" fill="url(#cosmicBg)" stroke="#3b1d60" stroke-width="1.8"/>

  <!-- Ambient Whimsical Pastel Glow Orbs -->
  <circle cx="150" cy="70" r="110" fill="#f43f5e" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="780" cy="80" r="120" fill="#c084fc" opacity="0.16" filter="url(#softGlow)" />
  <circle cx="460" cy="190" r="130" fill="#38bdf8" opacity="0.09" filter="url(#softGlow)" />

  <!-- Playful Wavy Aurora Wave at Bottom -->
  <path d="M 0 195 Q 160 160, 340 190 T 700 180 T 920 190 L 920 250 L 0 250 Z" fill="#ff758c" opacity="0.05" />
  <path d="M 0 210 Q 220 170, 460 205 T 920 198 L 920 250 L 0 250 Z" fill="#c084fc" opacity="0.08" />

  <!-- Glowing Top Border Line -->
  <line x1="80" y1="1.5" x2="840" y2="1.5" stroke="url(#holoGradient)" stroke-width="3" opacity="0.85" stroke-linecap="round" />

  <!-- Cute Macaron Window Dots (Top Left) -->
  <circle cx="34" cy="26" r="6" fill="#ff6b8b" opacity="0.9" />
  <circle cx="52" cy="26" r="6" fill="#ffd166" opacity="0.9" />
  <circle cx="70" cy="26" r="6" fill="#06d6a0" opacity="0.9" />

  <!-- Whimsical Little Twinkle Stars & Sparkles -->
  <use href="#sparkleStar" x="120" y="55" fill="#fbcfe8" opacity="0.8" />
  <use href="#miniStar" x="155" y="105" fill="#fde047" opacity="0.85" />
  <use href="#sparkleStar" x="800" y="60" fill="#a7f3d0" opacity="0.85" />
  <use href="#miniStar" x="845" y="115" fill="#f472b6" opacity="0.9" />
  <use href="#miniStar" x="240" y="40" fill="#67e8f9" opacity="0.75" />
  <use href="#miniStar" x="690" y="42" fill="#e9d5ff" opacity="0.8" />
  <circle cx="180" cy="45" r="2" fill="#fff" opacity="0.7" />
  <circle cx="750" cy="48" r="2.5" fill="#ffc6ff" opacity="0.8" />
  <circle cx="860" cy="75" r="1.8" fill="#caffbf" opacity="0.7" />
  <circle cx="85" cy="88" r="2.2" fill="#ffd6a5" opacity="0.7" />

  <!-- Main Name Title -->
  <text x="460" y="102" text-anchor="middle" class="name-title" filter="url(#softGlow)">✧ MANYA KESERWANI ✧</text>

  <!-- Whimsical Subtitle -->
  <text x="460" y="138" text-anchor="middle" class="subtitle">AI / ML Engineer  •  Real-Time Systems  •  3D Web Crafts</text>

  <!-- Playful Badge Pills (Row) -->
  <g transform="translate(145, 172)">
    <!-- Pill 1: YOLOv8 & Vision -->
    <g transform="translate(0, 0)">
      <rect width="185" height="32" rx="16" fill="url(#pillGrad1)" stroke="#ff758c" stroke-width="1.2" />
      <text x="92" y="20.5" text-anchor="middle" class="pill-text" fill="#fda4af">✨ Custom YOLOv8</text>
    </g>

    <!-- Pill 2: Real-Time WebSockets -->
    <g transform="translate(200, 0)">
      <rect width="210" height="32" rx="16" fill="url(#pillGrad2)" stroke="#c084fc" stroke-width="1.2" />
      <text x="105" y="20.5" text-anchor="middle" class="pill-text" fill="#e9d5ff">⚡ Real-Time WebSockets</text>
    </g>

    <!-- Pill 3: 3D React Three Fiber -->
    <g transform="translate(425, 0)">
      <rect width="205" height="32" rx="16" fill="url(#pillGrad3)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="102" y="20.5" text-anchor="middle" class="pill-text" fill="#bae6fd">🎨 3D Interactive Web</text>
    </g>
  </g>
</svg>
